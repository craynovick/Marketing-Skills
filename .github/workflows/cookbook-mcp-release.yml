name: Cookbook MCP connector release
on:
  push:
    tags: ['cookbook-mcp-v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integrations && pnpm test:mcp && pnpm build:mcp
      - name: Verify version and package
        run: |
          VERSION=$(node -p "require('./packages/cookbook-mcp/package.json').version")
          test "$GITHUB_REF_NAME" = "cookbook-mcp-v$VERSION"
          cd packages/cookbook-mcp
          npm pack --pack-destination ../..
          cd ../..
          sha256sum cookbook-mcp-connector-*.tgz > SHA256SUMS
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" cookbook-mcp-connector-*.tgz SHA256SUMS --title "$GITHUB_REF_NAME" --notes "Cookbook MCP connector. See the repository integration guide for installation and connection instructions."
